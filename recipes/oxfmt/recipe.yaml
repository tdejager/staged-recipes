context:
  version: "0.28.0"
  oxlint_version: "1.43.0"

package:
  name: oxfmt
  version: ${{ version }}

source:
  url: https://github.com/oxc-project/oxc/archive/oxlint_v${{ oxlint_version }}.tar.gz
  sha256: bcf09fda2749b3df123d2a08877dc9b8a7f7e14e8153d5e623e8056378c7986d

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses

tests:
  - script:
      - oxfmt --help
      - oxfmt --version

about:
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: A blazing fast JavaScript and TypeScript formatter written in Rust
  description: |
    Oxfmt is a high-performance code formatter for JavaScript and TypeScript,
    part of the Oxc toolchain. It is approximately 30x faster than Prettier
    and maintains high compatibility with Prettier's formatting output.
  homepage: https://oxc.rs/
  repository: https://github.com/oxc-project/oxc
  documentation: https://oxc.rs/docs/guide/usage/formatter

extra:
  recipe-maintainers:
    - danielnachun
